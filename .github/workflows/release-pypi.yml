name: Publish to PyPI

# Builds the sdist + wheel from the current main (with the committed chrome_150
# binaries) and publishes to PyPI. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match tls_client/__version__.py)"
        default: "1.4"
        required: true

permissions:
  contents: read
  id-token: write   # for OIDC trusted publishing fallback

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify version matches package
        run: |
          set -euo pipefail
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('tls_client/__version__.py').read()).group(1))")
          echo "package __version__=$v, requested=${{ inputs.version }}"
          [ "$v" = "${{ inputs.version }}" ] || { echo "::error::__version__ ($v) != requested (${{ inputs.version }})"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -la dist
      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
